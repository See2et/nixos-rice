split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
close_tab = "prefix+shift+x"
detach = "prefix+q"
copy_mode = "prefix+["
help = "prefix+?"
workspace_picker = ""
goto = ""
settings = ""
reload_config = ""
open_notification_target = ""
new_worktree = ""
rename_workspace = ""
close_workspace = ""
rename_tab = ""
switch_tab = ""
rename_pane = ""
edit_scrollback = ""
cycle_pane_next = ""
cycle_pane_previous = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
zoom = ""
resize_mode = ""
toggle_sidebar = ""
remote_image_paste = ""

